<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project List — Kanban Pipeline Board</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #e8e0d4;
    --surface: #f5f1eb;
    --surface-muted: #eee8de;
    --border: #d4cdc4;
    --border-strong: #b8a99a;
    --text-primary: #2a2018;
    --text-secondary: #4a3e30;
    --text-muted: #7a6e5e;
    --text-faint: #9a8a78;

    --stage-plan: #8b5cf6;
    --stage-rec: #ca8a04;
    --stage-1st: #3b82f6;
    --stage-2nd: #1d4ed8;
    --stage-rev: #ea580c;
    --stage-ready: #16a34a;
    --stage-pub: #166534;
    --stage-arch: #78716c;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
  }

  .banner {
    text-align: center;
    padding: 6px 16px;
    font-size: 11px;
    color: var(--text-faint);
    letter-spacing: 0.5px;
    border-bottom: 1px solid var(--border);
    background: var(--surface-muted);
  }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }

  .toolbar h1 {
    font-size: 18px;
    font-weight: 700;
    color: var(--text-primary);
    white-space: nowrap;
  }

  .toolbar .subtitle {
    font-size: 12px;
    color: var(--text-muted);
    white-space: nowrap;
  }

  .search-box {
    margin-left: auto;
    position: relative;
    width: 280px;
  }

  .search-box input {
    width: 100%;
    padding: 7px 12px 7px 32px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface-muted);
    font-size: 13px;
    color: var(--text-primary);
    outline: none;
    transition: border-color 0.15s;
  }

  .search-box input:focus {
    border-color: var(--border-strong);
  }

  .search-box input::placeholder { color: var(--text-faint); }

  .search-box .search-icon {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-faint);
    font-size: 13px;
    pointer-events: none;
  }

  .board {
    display: flex;
    gap: 10px;
    padding: 14px 14px 14px 14px;
    overflow-x: auto;
    align-items: flex-start;
    min-height: calc(100vh - 80px);
  }

  .column {
    flex: 0 0 178px;
    min-width: 178px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    max-height: calc(100vh - 100px);
  }

  .column.collapsed {
    flex: 0 0 42px;
    min-width: 42px;
  }

  .col-header {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
    position: sticky;
    top: 0;
    background: var(--surface);
    border-radius: 8px 8px 0 0;
    z-index: 1;
  }

  .col-header .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .col-header .label {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-primary);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    white-space: nowrap;
  }

  .col-header .count {
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 400;
    margin-left: auto;
    white-space: nowrap;
  }

  .col-header .toggle {
    font-size: 12px;
    color: var(--text-faint);
    margin-left: 4px;
    flex-shrink: 0;
  }

  .column.collapsed .col-header {
    writing-mode: vertical-rl;
    text-orientation: mixed;
    padding: 12px 8px;
    border-bottom: none;
    border-radius: 8px;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .column.collapsed .col-header .toggle { transform: rotate(90deg); }

  .col-cards {
    overflow-y: auto;
    padding: 6px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .column.collapsed .col-cards { display: none; }

  .card {
    background: var(--surface-muted);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 6px 8px;
    font-size: 11px;
    cursor: default;
    transition: opacity 0.2s, box-shadow 0.15s;
    line-height: 1.35;
  }

  .card:hover {
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    border-color: var(--border-strong);
  }

  .card.dead {
    opacity: 0.42;
  }

  .card.dead:hover { opacity: 0.65; }

  .card .card-top {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .card .code {
    font-weight: 700;
    color: var(--text-primary);
    font-size: 12px;
  }

  .card .star {
    margin-left: auto;
    color: var(--text-faint);
    font-size: 11px;
    cursor: pointer;
  }

  .card .star.active { color: #ca8a04; }

  .card .card-meta {
    display: flex;
    gap: 8px;
    margin-top: 3px;
    color: var(--text-muted);
    font-size: 10px;
  }

  .card .card-name {
    color: var(--text-secondary);
    font-size: 10.5px;
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card .age-dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    margin-right: 2px;
    vertical-align: middle;
  }

  .age-fresh { background: #16a34a; }
  .age-recent { background: #ca8a04; }
  .age-stale { background: #ea580c; }
  .age-old { background: #dc2626; }
  .age-ancient { background: #78716c; }

  .hidden { display: none !important; }

  .board::-webkit-scrollbar { height: 8px; }
  .board::-webkit-scrollbar-track { background: var(--bg); }
  .board::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }

  .col-cards::-webkit-scrollbar { width: 4px; }
  .col-cards::-webkit-scrollbar-track { background: transparent; }
  .col-cards::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .no-results {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-muted);
    font-size: 14px;
    display: none;
  }
</style>
</head>
<body>

<div class="banner">Mochaccino — project-list-02-kanban-pipeline — 2026-03-25</div>

<div class="toolbar">
  <h1>Projects</h1>
  <span class="subtitle">72 projects &middot; Kanban Pipeline</span>
  <div class="search-box">
    <span class="search-icon">&#128269;</span>
    <input type="text" id="searchInput" placeholder="Search projects..." autocomplete="off">
  </div>

<div class="board" id="board"></div>
<div class="no-results" id="noResults">No projects match your search.</div>

  { code:'b80', name:'sponsor-deals', stage:'rec', files:1, transcript:0, age:'ancient', starred:false },
  { code:'b81', name:'email-list', stage:'arch', files:5, transcript:60, age:'ancient', starred:false },

];

function isDead(p) {
  return p.files <= 2 && (p.age === 'old' || p.age === 'ancient');
}

function ageLabel(age) {
  const map = { fresh:'< 7d', recent:'< 30d', stale:'1-3mo', old:'3-6mo', ancient:'6mo+' };
  return map[age] || age;
}

function renderCard(p) {
  const dead = isDead(p) ? ' dead' : '';
  const starCls = p.starred ? ' active' : '';
  return `<div class="card${dead}" data-code="${p.code}" data-name="${p.name}" data-stage="${p.stage}">
    <div class="card-top">
      <span class="code">${p.code}</span>
      <span class="star${starCls}">${p.starred ? '&#9733;' : '&#9734;'}</span>
    </div>
    <div class="card-name" title="${p.name}">${p.name}</div>
    <div class="card-meta">
      <span>${p.files} files</span>
      <span>${p.transcript}%</span>
      <span><span class="age-dot age-${p.age}"></span>${ageLabel(p.age)}</span>
    </div>
  </div>`;
}

function buildBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';

  STAGES.forEach(stage => {
    const items = PROJECTS.filter(p => p.stage === stage.key);
    const col = document.createElement('div');
    col.className = 'column';
    col.dataset.stage = stage.key;

    col.innerHTML = `
      <div class="col-header" onclick="toggleColumn(this)">
        <span class="dot" style="background:${stage.color}"></span>
        <span class="label">${stage.label}</span>
        <span class="count">${items.length}</span>
        <span class="toggle">&#9660;</span>
      </div>
      <div class="col-cards">
        ${items.map(renderCard).join('')}
      </div>
    `;
    board.appendChild(col);
  });
}

function toggleColumn(header) {
  const col = header.parentElement;
  col.classList.toggle('collapsed');
  const toggle = header.querySelector('.toggle');
  if (col.classList.contains('collapsed')) {
    toggle.innerHTML = '&#9654;';
  } else {
    toggle.innerHTML = '&#9660;';
  }
}

function filterProjects(query) {
  const q = query.toLowerCase().trim();
  const cards = document.querySelectorAll('.card');
  let anyVisible = false;

  cards.forEach(card => {
    const code = card.dataset.code;
    const name = card.dataset.name;
    const match = !q || code.includes(q) || name.includes(q);
    card.classList.toggle('hidden', !match);
    if (match) anyVisible = true;
  });

  // Update column counts
  document.querySelectorAll('.column').forEach(col => {
    const visible = col.querySelectorAll('.card:not(.hidden)').length;
    col.querySelector('.count').textContent = visible;
  });

  document.getElementById('noResults').style.display = anyVisible ? 'none' : 'block';
}

document.getElementById('searchInput').addEventListener('input', e => {
  filterProjects(e.target.value);
});

buildBoard();
</script>

</html>
